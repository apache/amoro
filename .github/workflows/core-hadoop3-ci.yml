# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Core/hadoop3 CI with Maven

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "master"
      - "0.**"

  pull_request:
    branches:
      - "master"
      - "0.**"
    paths:
      - ".github/workflows/**"
      - "amoro-ams/**"
      - "amoro-common/**"
      - "amoro-metrics/**"
      - "amoro-optimizer/**"
      - "amoro-format-iceberg/**"
      - "amoro-format-paimon/**"
      - "amoro-format-hudi/**"
      - "amoro-format-mixed/amoro-mixed-flink/**"
      - "amoro-format-mixed/amoro-mixed-hive/**"
      - "amoro-format-mixed/amoro-mixed-spark/**"
      - "pom.xml"
      - "tools/maven/**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [ '11', '17' ]
        spark: [ '3.3','3.4', '3.5' ]
        exclude:
          - jdk: '17'
            spark: '3.3'
          - jdk: '17'
            spark: '3.4'
    name: Build Amoro with JDK ${{ matrix.jdk }} Spark-${{ matrix.spark }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
          cache: maven
          check-latest: false

      - name: Validate checkstyle first
        run: ./mvnw validate

      - name: Build all modules with Maven
        if: matrix.spark != '3.3'
        run: ./mvnw clean install -Djacoco.flink.skip=true -B -ntp -Pjava${{ matrix.jdk }} -Pspark-${{ matrix.spark }}

      - name: Build Spark 3.3 connectors and optimizers
        if: matrix.spark == '3.3'
        run: ./mvnw clean install -pl '!amoro-ams,!dist' -Djacoco.flink.skip=true -B -ntp -Pjava${{ matrix.jdk }} -Pspark-${{ matrix.spark }}

      # Standard-directory tests already run in the full build above.
      - name: Test Paimon AMS integration
        if: matrix.spark == '3.5'
        run: |
          ./mvnw test -pl amoro-ams -am -B -ntp \
            -Pjava${{ matrix.jdk }},support-paimon-format,spark-3.5,skip-dashboard-build \
            -Dtest=TestPaimonProcessIntegration \
            -Dsurefire.failIfNoSpecifiedTests=false
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          report = ET.parse('amoro-ams/target/surefire-reports/TEST-org.apache.amoro.server.process.TestPaimonProcessIntegration.xml').getroot()
          assert int(report.get('tests', '0')) > 0, 'Paimon AMS integration tests did not run'
          assert all(int(report.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped')), report.attrib
          PYTHON

      - name: Code coverage
        uses: codecov/codecov-action@v3
        with:
          verbose: true
          flags: core

  paimon-1-1-1:
    name: Paimon 1.1.1 format regression with JDK 17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          check-latest: false
      - name: Test Paimon 1.1.1 and Scala 2.13
        run: |
          ./mvnw clean test -pl amoro-format-paimon -am -B -ntp \
            -Pjava17,scala-2.13 \
            -Dtest=TestPaimonSnapshotExpiration,TestPaimonTableRefresh \
            -Dsurefire.failIfNoSpecifiedTests=false
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          for test_class in (
              'org.apache.amoro.formats.paimon.process.TestPaimonSnapshotExpiration',
              'org.apache.amoro.formats.paimon.TestPaimonTableRefresh',
          ):
              report = ET.parse(f'amoro-format-paimon/target/surefire-reports/TEST-{test_class}.xml').getroot()
              assert int(report.get('tests', '0')) > 0, f'{test_class} did not run'
              assert all(int(report.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped')), report.attrib
          PYTHON

  spark-optimizer-4-1:
    name: Build Spark 4.1 Optimizer with JDK 17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          check-latest: false

      - name: Build and test Spark 4.1 optimizer
        run: >-
          ./mvnw clean package
          -pl amoro-optimizer/amoro-optimizer-spark -am
          -Doptimizer.spark.version=4.1.3
          -Dtest=TestSparkOptimizerLocalMode
          -Djacoco.skip=true
          -B -ntp

      - name: Verify shaded optimizer excludes Spark and Scala
        shell: bash
        run: |
          optimizer_jar=$(find amoro-optimizer/amoro-optimizer-spark/target \
            -maxdepth 1 -name 'amoro-optimizer-spark-4.1_2.13-*-jar-with-dependencies.jar' \
            -print -quit)
          test -n "${optimizer_jar}"
          jar tf "${optimizer_jar}" > optimizer-jar-contents.txt
          if grep -Eq '^(org/apache/spark/|scala/)' optimizer-jar-contents.txt; then
            echo "Spark or Scala classes found in ${optimizer_jar}"
            exit 1
          fi
