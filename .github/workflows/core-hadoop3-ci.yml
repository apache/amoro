# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Core/hadoop3 CI with Maven

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "master"
      - "0.**"

  pull_request:
    branches:
      - "master"
      - "0.**"
    paths:
      - ".github/workflows/**"
      - "amoro-ams/**"
      - "amoro-common/**"
      - "amoro-metrics/**"
      - "amoro-optimizer/**"
      - "amoro-format-iceberg/**"
      - "amoro-format-paimon/**"
      - "amoro-format-hudi/**"
      - "amoro-format-mixed/amoro-mixed-flink/**"
      - "amoro-format-mixed/amoro-mixed-hive/**"
      - "amoro-format-mixed/amoro-mixed-spark/**"
      - "pom.xml"
      - "tools/maven/**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [ '11', '17' ]
        spark: [ '3.3','3.4', '3.5' ]
        exclude:
          - jdk: '17'
            spark: '3.3'
          - jdk: '17'
            spark: '3.4'
    name: Build Amoro with JDK ${{ matrix.jdk }} Spark-${{ matrix.spark }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
          cache: maven
          check-latest: false

      - name: Validate checkstyle first
        run: ./mvnw validate

      - name: Build all modules with Maven
        run: ./mvnw clean install -Djacoco.flink.skip=true -B -ntp -Pjava${{ matrix.jdk }} -Pspark-${{ matrix.spark }}

      - name: Code coverage
        uses: codecov/codecov-action@v3
        with:
          verbose: true
          flags: core

  spark-optimizer-4-1:
    name: Build Spark 4.1 Optimizer with JDK 17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          check-latest: false

      - name: Build and test Spark 4.1 optimizer
        run: >-
          ./mvnw clean package
          -pl amoro-optimizer/amoro-optimizer-spark -am
          -Pjava17,optimizer-spark-4.1
          -Dtest=TestSparkOptimizerLocalMode
          -Djacoco.skip=true
          -B -ntp

      - name: Verify shaded optimizer excludes Spark and Scala
        shell: bash
        run: |
          optimizer_jar=$(find amoro-optimizer/amoro-optimizer-spark/target \
            -maxdepth 1 -name 'amoro-optimizer-spark-4.1_2.13-*-jar-with-dependencies.jar' \
            -print -quit)
          test -n "${optimizer_jar}"
          jar tf "${optimizer_jar}" > optimizer-jar-contents.txt
          if grep -Eq '^(org/apache/spark/|scala/)' optimizer-jar-contents.txt; then
            echo "Spark or Scala classes found in ${optimizer_jar}"
            exit 1
          fi
