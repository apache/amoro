name: Format Integrations

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "master"
      - "[0-9]+.**"
  pull_request:
    branches:
      - "master"
      - "[0-9]+.**"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect format changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          elif bash dev/ci/has-changes.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            '^amoro-common/|^amoro-format-(hudi|paimon|lance)/|^pom\.xml$|^tools/maven/|^dev/ci/|^\.github/workflows/format-integrations-ci\.yml$'; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hadoop: '2'
            jdk: '11'
            profiles: hadoop2,java11
          - hadoop: '3'
            jdk: '11'
            profiles: java11
    name: Formats / Hadoop ${{ matrix.hadoop }} / JDK ${{ matrix.jdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin
          cache: maven
      - name: Verify optional formats
        run: >-
          ./mvnw -B -ntp verify
          -pl amoro-format-hudi,amoro-format-paimon,amoro-format-lance
          -am -P${{ matrix.profiles }}

  gate:
    name: CI / Format Integrations
    if: always()
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        shell: bash
        run: |
          [[ "${{ needs.changes.result }}" == "success" ]]
          [[ "${{ needs.build.result }}" == "success" || "${{ needs.build.result }}" == "skipped" ]]
