name: Trino Mixed Format Connector

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "master"
      - "[0-9]+.**"
  pull_request:
    branches:
      - "master"
      - "[0-9]+.**"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect Trino connector changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          elif bash dev/ci/has-changes.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            '^amoro-common/|^amoro-format-iceberg/|^amoro-format-mixed/amoro-mixed-(hive|trino)/|^pom\.xml$|^tools/maven/|^dev/ci/|^\.github/workflows/trino-ci\.yml$'; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hadoop: '2'
            profiles: hadoop2,java17,format-mixed-format-trino,build-mixed-format-trino
          - hadoop: '3'
            profiles: java17,format-mixed-format-trino,build-mixed-format-trino
    name: Trino 406 / Hadoop ${{ matrix.hadoop }} / JDK 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Verify Trino mixed-format connector
        run: >-
          ./mvnw -B -ntp verify
          -pl amoro-format-mixed/amoro-mixed-trino
          -am -P${{ matrix.profiles }}
      - name: Upload Trino coverage
        uses: codecov/codecov-action@v5
        with:
          flags: trino

  gate:
    name: CI / Trino Mixed Format Connector
    if: always()
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        shell: bash
        run: |
          [[ "${{ needs.changes.result }}" == "success" ]]
          [[ "${{ needs.build.result }}" == "success" || "${{ needs.build.result }}" == "skipped" ]]
