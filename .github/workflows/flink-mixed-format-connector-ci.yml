name: Flink Mixed Format Connector

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "master"
      - "[0-9]+.**"
  pull_request:
    branches:
      - "master"
      - "[0-9]+.**"
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect Flink connector changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          elif bash dev/ci/has-changes.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            '^amoro-common/|^amoro-format-iceberg/|^amoro-format-paimon/|^amoro-format-mixed/amoro-mixed-(flink|hive)/|^pom\.xml$|^tools/maven/|^dev/ci/|^\.github/workflows/flink-mixed-format-connector-ci\.yml$'; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

  pr-build:
    needs: changes
    if: needs.changes.outputs.changed == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flink: '1.18'
            hadoop: '2'
            jdk: '11'
            profiles: hadoop2,java11
          - flink: '1.19'
            hadoop: '3'
            jdk: '11'
            profiles: java11
          - flink: '1.20'
            hadoop: '3'
            jdk: '11'
            profiles: java11
    name: Flink ${{ matrix.flink }} / Hadoop ${{ matrix.hadoop }} / JDK ${{ matrix.jdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin
          cache: maven
      - name: Verify Flink mixed-format runtime
        run: >-
          ./mvnw -B -ntp verify
          -pl amoro-format-mixed/amoro-mixed-flink/v${{ matrix.flink }}/amoro-mixed-flink-runtime-${{ matrix.flink }}
          -am -P${{ matrix.profiles }}
      - name: Upload Flink coverage
        uses: codecov/codecov-action@v5
        with:
          flags: flink

  nightly-build:
    needs: changes
    if: needs.changes.outputs.changed == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flink: [ '1.18', '1.19', '1.20' ]
        hadoop: [ '2', '3' ]
    name: Flink full / ${{ matrix.flink }} / Hadoop ${{ matrix.hadoop }} / JDK 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven
      - name: Verify Flink mixed-format runtime
        run: >-
          ./mvnw -B -ntp verify
          -pl amoro-format-mixed/amoro-mixed-flink/v${{ matrix.flink }}/amoro-mixed-flink-runtime-${{ matrix.flink }}
          -am -Pjava11${{ matrix.hadoop == '2' && ',hadoop2' || '' }}

  gate:
    name: CI / Flink Mixed Format Connector
    if: always()
    needs:
      - changes
      - pr-build
      - nightly-build
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        shell: bash
        run: |
          [[ "${{ needs.changes.result }}" == "success" ]]
          [[ "${{ needs.pr-build.result }}" == "success" || "${{ needs.pr-build.result }}" == "skipped" ]]
          [[ "${{ needs.nightly-build.result }}" == "success" || "${{ needs.nightly-build.result }}" == "skipped" ]]
