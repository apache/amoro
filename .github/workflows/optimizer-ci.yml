name: Optimizer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "master"
      - "[0-9]+.**"
  pull_request:
    branches:
      - "master"
      - "[0-9]+.**"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect optimizer changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          elif bash dev/ci/has-changes.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            '^amoro-optimizer/|^amoro-common/|^amoro-format-iceberg/|^amoro-format-mixed/amoro-mixed-hive/|^pom\.xml$|^tools/maven/|^dev/ci/|^\.github/workflows/optimizer-ci\.yml$'; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - implementation: standalone
            module: amoro-optimizer/amoro-optimizer-standalone
            engine: Java
            jdk: '11'
            profiles: java11
          - implementation: flink
            module: amoro-optimizer/amoro-optimizer-flink
            engine: Flink-1.18.1
            jdk: '11'
            profiles: java11
          - implementation: spark
            module: amoro-optimizer/amoro-optimizer-spark
            engine: Spark-3.3
            jdk: '11'
            profiles: java11,spark-3.3
          - implementation: spark
            module: amoro-optimizer/amoro-optimizer-spark
            engine: Spark-3.4
            jdk: '11'
            profiles: java11,spark-3.4
          - implementation: spark
            module: amoro-optimizer/amoro-optimizer-spark
            engine: Spark-3.5
            jdk: '11'
            profiles: java11,spark-3.5
    name: ${{ matrix.implementation }} / ${{ matrix.engine }} / JDK ${{ matrix.jdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin
          cache: maven
      - name: Verify optimizer
        run: >-
          ./mvnw -B -ntp verify
          -pl ${{ matrix.module }} -am
          -P${{ matrix.profiles }}
      - name: Upload optimizer coverage
        uses: codecov/codecov-action@v5
        with:
          flags: optimizer

  gate:
    name: CI / Optimizer
    if: always()
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        shell: bash
        run: |
          [[ "${{ needs.changes.result }}" == "success" ]]
          [[ "${{ needs.build.result }}" == "success" || "${{ needs.build.result }}" == "skipped" ]]
